id = "torchmaster"
name = "Torchmaster"
version = "0.2.6"
description = """Torchmaster for Horizon: the Mega Torch keeps hostile monsters from spawning
naturally in a cube of 64 blocks around it, and the Dread Lamp does the same for passive animals
like squids, bats and ocelots. A Mega Torch in range also stops phantoms from spawning near an
insomniac player, the other veto upstream declares. The Feral Flare Lantern writes invisible light
blocks into empty, dark cells around itself and removes them when it breaks; that light also
quiets a mob spawner whose cell it reaches, above vanilla's light limit. The Frozen Pearl clears
those residual lights in a 31-block cube around the player, spending one of its 1024 charges per
light. Each block and the pearl has a recipe and a place in the creative tab. Only the natural
spawn path is vetoed by the two blocking lights, so spawn eggs, breeding and commands still work,
exactly as the original's blockOnlyNaturalSpawns default asks."""
authors = ["Xalcon", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world or a LAN host needs both. A dedicated server is "server".
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the mega
# torch and the dread lamp are two of the mod's own blocks.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
