[package]
# Port of Torchmaster 21.1.14 (Xalcon/TorchMaster, MIT) for Minecraft 26.3 on
# Horizon 0a875da9, the build named in horizon-mod.toml. The logic in
# src/runtime.rs is carried unchanged from the retired .hnmod bundle; only the
# glue in src/lib.rs is written against the SDK. Local-only until publishing is
# approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "torchmaster"
version = "0.2.7"
edition = "2024"
license = "MIT"
description = "Torchmaster for Horizon: blocking lights veto natural spawns, phantom spawns near insomniac players and village sieges, the Feral Flare Lantern writes invisible light that quiets mob spawners, and the Frozen Pearl clears residual light"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
#
# This is the only dependency the registry accepts: R9 (tools/native-subset/src/manifests.rs)
# refuses any other, and R10 accepts no packed `Cargo.lock` for an SDK-only package. The port used
# to declare `log = "0.4"` and pack the launcher's lock; both are gone since 0.2.2 — the readout
# `/torchmaster` carries the information the log lines used to, so no crate is needed.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
