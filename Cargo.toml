[package]
# Port of Torchmaster 21.1.14 (Xalcon/TorchMaster, MIT) for Minecraft 26.3 on
# Horizon 0b14f8a, the build named in horizon-mod.toml. The logic in
# src/runtime.rs is carried unchanged from the retired .hnmod bundle; only the
# glue in src/lib.rs is written against the SDK. Local-only until publishing is
# approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "torchmaster"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Torchmaster for Horizon: the Mega Torch and the Dread Lamp keep natural spawns out of a cube"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# horizon-mod-api itself depends on log 0.4, so the version is already in the
# pinned build's graph; the mod only needs it to say which light it registered.
log = "0.4"
